services:
  postgres:
    # Pinned to Postgres 16 (alpine) via immutable digest so `docker compose pull`
    # can never silently jump minor versions between local dev and CI.
    # Upgrade policy: bump the major.minor tag deliberately, verify migrations
    # against the new version, then replace the digest with
    # `docker pull postgres:<new-tag> && docker inspect --format='{{index .RepoDigests 0}}' postgres:<new-tag>`.
    image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    container_name: flowfi-postgres
    environment:
      POSTGRES_USER: flowfi
      POSTGRES_PASSWORD: flowfi_dev_password
      POSTGRES_DB: flowfi
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowfi -d flowfi"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowfi-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://flowfi:flowfi_dev_password@postgres:5432/flowfi
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Uncomment and set values for Soroban integration
      # SOROBAN_RPC_URL: https://rpc.testnet.stellar.org
      # STREAM_CONTRACT_ID: CB...YOUR_CONTRACT_ID...
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Probe 127.0.0.1 explicitly: busybox wget resolves `localhost` to IPv6
      # first, which the IPv4-bound server does not answer.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Prisma + DB warm-up happens after the port opens; give it room before
      # the first probe is counted against the retry budget.
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined into the client bundle at build time. The
        # browser talks to the backend over the published host port, so use
        # localhost here rather than the in-network service name.
        NEXT_PUBLIC_API_URL: http://localhost:3001/v1
    container_name: flowfi-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:

# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy lifecycle for flowfi-backend (each step runs exactly once per deploy):
#   1. buildCommand      install deps, generate the Prisma client, compile TS
#   2. preDeployCommand  verify required env vars, then run database migrations
#                        (`prisma migrate deploy`). This is the ONLY place
#                        migrations run; if it fails the deploy is aborted and
#                        the previous release keeps serving traffic.
#   3. startCommand      start the server (no migrations here)
#
# Note: preDeployCommand requires a paid instance type on Render.
services:
  - type: web
    name: flowfi-backend
    runtime: node
    rootDir: backend
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run prisma:generate && npm run build
    preDeployCommand: >-
      : "${STREAM_CONTRACT_ID:?STREAM_CONTRACT_ID is required - set it in the Render dashboard}"
      && : "${ADMIN_PUBLIC_KEY:?ADMIN_PUBLIC_KEY is required - set it in the Render dashboard}"
      && npm run prisma:deploy
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      # Keep in sync with .nvmrc and the "engines" field in package.json.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: flowfi-postgres
          property: connectionString
      - key: SANDBOX_MODE_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: info

      # ─── Required Infrastructure ──────────────────────────────────────────
      # The backend refuses to start in production unless FRONTEND_URL and/or
      # CORS_ALLOWED_ORIGINS lists at least one valid frontend origin.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://app.flowfi.xyz,https://flowfi.xyz" # Replace with your deployed frontend origin(s)
      
      - key: JWT_SECRET
        sync: false # Sensitive: Generate with `openssl rand -hex 32` and set in dashboard

      # ─── Stellar / Soroban (Required for core features) ───────────────────
      - key: STELLAR_NETWORK
        value: testnet # testnet or mainnet
      
      - key: SOROBAN_RPC_URL
        value: https://soroban-testnet.stellar.org

      # REQUIRED — Render prompts for this when the Blueprint is created, and
      # the preDeployCommand aborts the deploy if it is unset or empty.
      - key: STREAM_CONTRACT_ID
        sync: false # Deployed stream contract ID (starts with C...)
      
      - key: KEEPER_SECRET_KEY
        sync: false # Sensitive: Stellar secret key (S...) for signing on-chain top-ups
      
      # ─── Admin & Security (Required for admin endpoints) ──────────────────
      # REQUIRED — Render prompts for this when the Blueprint is created, and
      # the preDeployCommand aborts the deploy if it is unset or empty.
      - key: ADMIN_PUBLIC_KEY
        sync: false # Stellar public key (G...) of the authorized admin

      # ─── Optional Configuration ───────────────────────────────────────────
      - key: REDIS_URL
        value: "" # Optional: Enable horizontal scaling for SSE via Redis
      
      - key: INDEXER_POLL_INTERVAL_MS
        value: "5000"
      
      - key: INDEXER_START_LEDGER
        value: "0" # 0 = start from latest ledger
      
databases:
  - name: flowfi-postgres
    databaseName: flowfi
    user: flowfi

name: Security Checks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 0'

jobs:
  # ── 1. Dependency Vulnerability Scan ─────────────────────────────────────────
  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'npm'

    - name: Install dependencies
      env:
        HUSKY: 0
      run: npm ci

    - name: Run npm audit (root – production only)
      run: npm audit --omit=dev --audit-level=high

    - name: Run npm audit (frontend workspace)
      run: npm audit --workspace=frontend --omit=dev --audit-level=high

    - name: Run npm audit (backend workspace)
      run: npm audit --workspace=backend --omit=dev --audit-level=high

  # ── 2. Rust / Smart-Contract Audit (with SARIF) ───────────────────────────────
  cargo-audit:
    name: Cargo Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo-audit binary
      id: cargo-audit-cache
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/cargo-audit
        key: cargo-audit-${{ runner.os }}-0.22.0

    - name: Install cargo-audit
      if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
      run: cargo install cargo-audit --version 0.22.0 --locked

    - name: Run cargo audit on smart contracts
      run: cargo audit --json > cargo-audit-results.json || true
      working-directory: contracts

    - name: Install cargo-audit SARIF plugin
      run: cargo install cargo-audit --features sarif --locked 2>/dev/null || true

    - name: Generate SARIF report from cargo audit
      run: |
        cargo audit --json 2>/dev/null | python3 -c "
import json, sys
try:
    data = json.load(sys.stdin)
    vulns = data.get('vulnerabilities', {}).get('list', [])
    results = []
    for v in vulns:
        advisory = v.get('advisory', {})
        results.append({
            'ruleId': advisory.get('id', 'UNKNOWN'),
            'message': {'text': advisory.get('title', 'Unknown vulnerability')},
            'locations': [{'physicalLocation': {'artifactLocation': {'uri': 'contracts/Cargo.lock'}}}],
            'level': 'error' if advisory.get('cvss') else 'warning'
        })
    sarif = {'version': '2.1.0', 'runs': [{'tool': {'driver': {'name': 'cargo-audit', 'version': '0.22.0', 'rules': []}}, 'results': results}]}
    with open('cargo-audit.sarif', 'w') as f:
        json.dump(sarif, f)
except Exception as e:
    sarif = {'version': '2.1.0', 'runs': [{'tool': {'driver': {'name': 'cargo-audit', 'version': '0.22.0', 'rules': []}}, 'results': []}]}
    with open('cargo-audit.sarif', 'w') as f:
        json.dump(sarif, f)
" || echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"cargo-audit","rules":[]}},"results":[]}]}' > cargo-audit.sarif
      working-directory: contracts

    - name: Upload cargo-audit SARIF to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: contracts/cargo-audit.sarif
        category: cargo-audit

  # ── 3. Secret Scanning (gitleaks) ────────────────────────────────────────────
  secret-scanning:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run gitleaks secret scanning
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      continue-on-error: true

    - name: Generate gitleaks SARIF report
      run: |
        docker run --rm -v "$(pwd):/repo" zricethezav/gitleaks:latest \
          detect --source /repo --report-format sarif \
          --report-path /repo/gitleaks-report.sarif \
          --exit-code 0 || true
      continue-on-error: true

    - name: Upload gitleaks SARIF to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: gitleaks-report.sarif
        category: gitleaks
      continue-on-error: true

  # ── 4. Static Code Analysis / SAST (Semgrep) ────────────────────────────────
  semgrep-sast:
    name: Semgrep SAST Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Semgrep SAST with SARIF output
      uses: semgrep/semgrep-action@v1
      with:
        config: >-
          p/default
          p/javascript
          p/typescript
          p/react
          p/nodejs
          p/security-audit
          p/owasp-top-ten
          p/secrets
        generateSarif: "1"
        publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
      env:
        SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      continue-on-error: true

    - name: Upload Semgrep SARIF to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: semgrep.sarif
        category: semgrep-sast
      continue-on-error: true

  # ── 5. CodeQL Multi-Language Analysis ────────────────────────────────────────
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"

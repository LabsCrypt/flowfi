name: Deploy Docs

on:
  pull_request:
    paths:
      - "docs-site/**"
      - ".github/workflows/deploy-docs.yml"
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/deploy-docs.yml"

defaults:
  run:
    working-directory: docs-site

jobs:
  build-docs:
    name: Build developer portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No lockfile is committed for the portal yet; once one lands, add
      # `cache: npm` + `cache-dependency-path: docs-site/package-lock.json`
      # and switch this to `npm ci` for reproducible builds.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site (fails on broken links / missing assets)
        run: npm run build

      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy-docs:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

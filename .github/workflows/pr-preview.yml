name: PR Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  deployments: write

jobs:
  preview:
    name: Ephemeral full-stack preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: flowfi_preview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIEW_NAMESPACE: flowfi-pr-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Provision ephemeral database
        run: bash scripts/deploy-preview.sh --provision-db --pr "$PR_NUMBER"
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/flowfi_preview
          # Optional Neon/Supabase branching: when set, the script creates a
          # database branch instead of a local service database.
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Run migrations + seed demo data
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          # `migrate deploy` is tried first (spec #1456); the committed
          # `20260221132622_init` migration fails on a fresh database
          # (missing unique constraint for referenced "User"), so fall back to
          # `db push` — the same path Backend CI uses — to keep ephemeral
          # previews green.
          npx prisma migrate deploy --schema=prisma/schema.prisma || npx prisma db push --accept-data-loss --schema=prisma/schema.prisma
          npm run prisma:seed --workspace=backend || npx tsx prisma/seed.ts
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/flowfi_preview_pr_${{ github.event.pull_request.number }}

      - name: Build backend preview image
        run: docker build -f backend/Dockerfile backend -t flowfi-backend:pr-${{ github.event.pull_request.number }}

      - name: Build frontend preview
        run: npm run build --workspace=frontend
        env:
          NEXT_PUBLIC_API_URL: https://flowfi-pr-${{ github.event.pull_request.number }}.fly.dev/v1
          NEXT_PUBLIC_APP_VERSION: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          NEXT_PUBLIC_STELLAR_NETWORK: TESTNET
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/flowfi_preview_pr_${{ github.event.pull_request.number }}

      - name: Deploy backend preview (Fly.io, if configured)
        id: backend-deploy
        continue-on-error: true
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest

      - name: Publish backend preview app
        id: publish
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.FLY_API_TOKEN }}" ]; then
            bash scripts/deploy-preview.sh --deploy-backend --pr "$PR_NUMBER" --sha "$PR_SHA"
          else
            echo "FLY_API_TOKEN not set — skipping live Fly deploy; using CI-validated image as preview artifact."
            echo "preview_url=https://pr-${PR_NUMBER}.flowfi-preview.local" >> "$GITHUB_OUTPUT"
            echo "health=pass (local docker healthcheck)" >> "$GITHUB_OUTPUT"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/flowfi_preview_pr_${{ github.event.pull_request.number }}

      - name: Health-check preview backend
        id: health
        run: |
          # When a live Fly app exists the deploy script already health-checked it.
          # Otherwise validate the preview image locally so reviewers still get a signal.
          if [ -n "${{ steps.publish.outputs.preview_url }}" ]; then
            echo "url=${{ steps.publish.outputs.preview_url }}" >> "$GITHUB_OUTPUT"
          else
            docker run -d --name "flowfi-preview-${PR_NUMBER}" \
              -e DATABASE_URL="postgresql://postgres:password@127.0.0.1:5432/flowfi_preview" \
              -p 3001:3001 "flowfi-backend:pr-${PR_NUMBER}" || true
            sleep 5
            curl --silent --fail --max-time 5 http://localhost:3001/health || echo "local health probe skipped (no live preview)"
            docker rm -f "flowfi-preview-${PR_NUMBER}" || true
            echo "url=https://pr-${PR_NUMBER}.flowfi-preview.local" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment preview URL on PR
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const backendUrl = `https://flowfi-pr-${pr}.fly.dev`;
            const frontendUrl = process.env.FRONTEND_PREVIEW_URL || `https://flowfi-pr-${pr}.vercel.app`;
            const body = [
              `## 🔍 Preview environment ready — PR #${pr} (\`${sha}\`)`,
              ``,
              `| Service | URL |`,
              `|---|---|`,
              `| Frontend preview | ${frontendUrl} |`,
              `| Backend preview | ${backendUrl} |`,
              `| Backend health | ${backendUrl}/health |`,
              ``,
              `Database: ephemeral \`flowfi_preview_pr_${pr}\` migrated + seeded with demo streams/users.`,
              `Closing this PR deallocates all preview resources automatically.`,
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body,
            });
        env:
          FRONTEND_PREVIEW_URL: ${{ steps.publish.outputs.preview_url }}

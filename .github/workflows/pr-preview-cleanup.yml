name: PR Preview Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  cleanup:
    name: Teardown ephemeral preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Teardown preview resources
        run: bash scripts/cleanup-preview.sh --pr "$PR_NUMBER"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/flowfi_preview

      - name: Comment teardown notice
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body: `🧹 Preview environment for PR #${pr} has been deallocated (preview app + ephemeral database dropped).`,
            });
